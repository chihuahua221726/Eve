<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Eve — Holidays in Eves</title>
<style>
  :root {
    --bg: #f5efe3;
    --fg: #34291f;
    --accent: #a64f32;
    --muted: #796b5a;
    --green: #52634b;
    --paper: #fffdf8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Georgia, serif;
    background:
      radial-gradient(ellipse at 50% 0%, #fffaf0 0%, transparent 58%),
      var(--bg);
    color: var(--fg);
    min-height: 100vh;
  }
  header.hero {
    position: relative;
    min-height: 560px;
    height: 72vh;
    max-height: 760px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
  }
  header.hero::before {
    content: "";
    position: absolute;
    width: min(760px, 100vw);
    height: 300px;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(180deg, transparent, #e9ddc9);
    border-radius: 50% 50% 0 0;
  }
  header.hero .content {
    position: relative;
    z-index: 1;
    transition: opacity 0.1s linear, transform 0.1s linear;
    will-change: opacity, transform;
  }
  .eyebrow {
    color: var(--green);
    font: 700 .78rem/1.2 "Segoe UI", system-ui, sans-serif;
    letter-spacing: .18em;
    text-transform: uppercase;
  }
  .cottage {
    display: block;
    width: clamp(150px, 27vw, 220px);
    height: auto;
    margin: 1.1rem auto .3rem;
    filter: drop-shadow(0 12px 10px rgba(79, 56, 35, .13));
  }
  header.hero h1 {
    font: 700 clamp(3.2rem, 10vw, 6.4rem)/.95 Georgia, serif;
    margin: 0;
    letter-spacing: .08em;
    color: var(--fg);
  }
  header.hero p {
    color: var(--muted);
    font: 1.05rem/1.6 "Segoe UI", system-ui, sans-serif;
    max-width: 60ch;
    margin: .8rem auto 0;
  }
  .fade-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 72%, var(--bg) 100%);
    pointer-events: none;
  }
  main {
    max-width: 820px;
    margin: 0 auto;
    padding: 2rem 1.5rem 5rem;
  }
  .list-intro {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 1rem;
    margin: 0 0 1.2rem;
  }
  .list-intro h2 {
    margin: 0;
    font: 700 clamp(1.7rem, 5vw, 2.3rem)/1.1 Georgia, serif;
  }
  .list-intro p {
    margin: 0;
    color: var(--muted);
    font: .9rem/1.5 "Segoe UI", system-ui, sans-serif;
  }
  .holiday {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    margin: .75rem 0;
    padding: 1.15rem 1.3rem;
    border: 1px solid #e8dece;
    border-radius: 16px;
    background: var(--paper);
    box-shadow: 0 4px 14px rgba(79, 56, 35, .045);
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  .holiday.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .holiday .name {
    font-weight: 600;
    color: var(--fg);
    font-size: 1.05rem;
  }
  .holiday .eves {
    display: block;
    margin-top: .5rem;
    color: var(--muted);
    font: .82rem/1.7 "Segoe UI", system-ui, sans-serif;
    line-height: 1.6;
    word-break: break-word;
  }
  .holiday .eves::before {
    content: "Until the door opens: ";
    color: var(--green);
    font-weight: 600;
  }
  footer {
    text-align: center;
    color: var(--muted);
    padding: 2rem 1rem 3rem;
    font: .85rem/1.5 "Segoe UI", system-ui, sans-serif;
  }
  @media (max-width: 560px) {
    header.hero { min-height: 480px; height: 66vh; }
    .list-intro { align-items: start; flex-direction: column; }
    .holiday { align-items: flex-start; flex-direction: column; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    .holiday { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
  <header class="hero" id="hero">
    <div class="content">
      <div class="eyebrow">A cozy place for what's coming</div>
      <svg class="cottage" viewBox="0 0 220 170" role="img" aria-label="A cozy little cottage">
        <path d="M25 82 110 18l85 64v71H25z" fill="#c98255"/>
        <path d="m15 84 95-72 95 72-9 12-86-65-86 65z" fill="#754536"/>
        <path d="M89 96h42v57H89z" fill="#70513d"/>
        <circle cx="121" cy="126" r="2.5" fill="#f3d28a"/>
        <path d="M43 98h29v30H43zM148 98h29v30h-29z" fill="#f4d38b"/>
        <path d="M57 98v30m-14-15h29m90-15v30m-14-15h29" stroke="#fff4d9" stroke-width="4"/>
        <path d="M100 45h20V20h-20z" fill="#754536"/>
        <path d="M16 154h188" stroke="#52634b" stroke-width="7" stroke-linecap="round"/>
        <path d="M36 153q0-20 13-27 13 7 13 27m94 0q0-20 13-27 13 7 13 27" fill="#71815b"/>
      </svg>
      <h1>EVE</h1>
      <p>Every holiday is a little reason to gather around the table.</p>
    </div>
    <div class="fade-overlay"></div>
  </header>

  <main>
    <div class="list-intro">
      <h2>Coming home soon</h2>
      <p>One eve for every day until the celebration.</p>
    </div>
    <section id="list" aria-label="Upcoming holidays"></section>
  </main>

  <footer>Save a seat. The next celebration is on its way.</footer>

<script>
  const list = document.getElementById('list');
  const hero = document.getElementById('hero');
  const heroContent = hero.querySelector('.content');
  function onScroll() {
    const y = window.scrollY;
    const limit = hero.offsetHeight;
    const progress = Math.min(y / limit, 1);
    heroContent.style.opacity = 1 - progress;
    heroContent.style.transform = `translateY(${-progress * 60}px) scale(${1 - progress * 0.15})`;
    hero.style.opacity = 1 - progress * 0.6;
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  async function loadHolidays() {
    const response = await fetch('eve_output.txt');
    if (!response.ok) {
      throw new Error(`Could not load eve_output.txt (${response.status})`);
    }

    const report = new TextDecoder('utf-16').decode(await response.arrayBuffer());
    const holidays = report.trimEnd().split(/\r?\n/).map((line, index) => {
      const separator = line.indexOf(' Is In ');
      if (separator < 0) {
        throw new Error(`Invalid eve_output.txt line ${index + 1}`);
      }
      return [line.slice(0, separator), line.slice(separator + 7)];
    });

    holidays.forEach(([name, eves]) => {
      const card = document.createElement('article');
      card.className = 'holiday';
      const title = document.createElement('span');
      title.className = 'name';
      title.textContent = `${name} Is In`;
      const countdown = document.createElement('span');
      countdown.className = 'eves';
      countdown.textContent = eves;
      card.append(title, countdown);
      list.appendChild(card);
    });

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add('visible');
      });
    }, { threshold: 0.1 });
    document.querySelectorAll('.holiday').forEach(card => observer.observe(card));
  }

  loadHolidays().catch((error) => {
    const message = document.createElement('p');
    message.setAttribute('role', 'alert');
    message.textContent = `The holiday list could not be loaded: ${error.message}`;
    list.replaceChildren(message);
  });
</script>
</body>
</html>
